[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "seshka-linux"
version = "0.1.0"
description = "Kill what Claude Code left behind — Ubuntu/Linux system tray + CLI"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.10"
authors = [{ name = "Marcin" }]
keywords = ["claude", "claude-code", "process", "cleanup", "linux", "ubuntu"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: X11 Applications :: GTK",
  "Intended Audience :: Developers",
  "Operating System :: POSIX :: Linux",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: System :: Systems Administration",
]
dependencies = []

[project.optional-dependencies]
gui = []
dev = ["pytest>=7.0"]

[project.scripts]
seshka = "seshka.cli:main"
seshka-gui = "seshka.gui.app:main"

[project.urls]
Homepage = "https://github.com/marcins/seshka-linux"
Issues = "https://github.com/marcins/seshka-linux/issues"
Upstream = "https://github.com/jigjoy-ai/seshka"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
seshka = ["gui/icons/*.png", "gui/icons/*.svg"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
